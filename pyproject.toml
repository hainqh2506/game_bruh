[project]
name = "doan-chu"
version = "0.1.0"
description = "Đoán Chữ Unlimited — unlimited Vietnamese 2-word Wordle-like, local + Quick Tunnel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsbeautifier>=2.0.3",
    "pytest>=9.1.1",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
